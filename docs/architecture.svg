<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" font-family="Times, serif" font-size="10">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#333"/>
    </marker>
  </defs>

  <rect width="320" height="600" fill="#fff"/>

  <text x="160" y="22" text-anchor="middle" font-size="12" font-weight="bold">IRnet</text>

  <!-- Input -->
  <rect x="90" y="38" width="140" height="28" fill="none" stroke="#333" stroke-width="1"/>
  <text x="160" y="56" text-anchor="middle">Input (N, 8080)</text>

  <line x1="160" y1="66" x2="160" y2="88" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="215" y="80" font-size="8" fill="#666">drop 0.5</text>

  <!-- Pathway Mapping -->
  <rect x="65" y="92" width="190" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="160" y="109" text-anchor="middle" font-weight="bold">Pathway Mapping</text>
  <text x="160" y="123" text-anchor="middle" font-size="9">sparse (KEGG), 8080 &gt; 344</text>

  <line x1="160" y1="132" x2="160" y2="154" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="200" y="146" font-size="8" fill="#666">ELU</text>

  <!-- Reshape -->
  <text x="160" y="166" text-anchor="middle" font-size="8" fill="#666">(N x 344, 1)</text>

  <line x1="160" y1="172" x2="160" y2="192" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- GAT block -->
  <rect x="55" y="195" width="210" height="185" fill="none" stroke="#333" stroke-width="1.4" rx="2"/>

  <!-- GAT1 -->
  <rect x="80" y="210" width="160" height="34" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="160" y="225" text-anchor="middle" font-size="9" font-weight="bold">Multi-Head Attention</text>
  <text x="160" y="238" text-anchor="middle" font-size="8">h=4, d=4, mean</text>

  <line x1="160" y1="244" x2="160" y2="264" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="200" y="257" font-size="7" fill="#666">BN</text>

  <!-- GAT2 -->
  <rect x="80" y="268" width="160" height="34" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="160" y="283" text-anchor="middle" font-size="9" font-weight="bold">Single-Head Attention</text>
  <text x="160" y="296" text-anchor="middle" font-size="8">h=1, d=4</text>

  <line x1="160" y1="302" x2="160" y2="322" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="200" y="315" font-size="7" fill="#666">BN</text>

  <!-- Pool -->
  <rect x="80" y="325" width="160" height="30" fill="#eee" stroke="#333" stroke-width="1"/>
  <text x="160" y="344" text-anchor="middle" font-size="9">Attentional Pooling</text>

  <!-- Side annotation -->
  <text x="280" y="260" font-size="7" fill="#666">344 nodes</text>
  <text x="280" y="272" font-size="7" fill="#666">3152 edges</text>
  <line x1="265" y1="266" x2="272" y2="266" stroke="#999" stroke-width="0.5"/>

  <line x1="160" y1="380" x2="160" y2="405" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
  <text x="160" y="396" text-anchor="middle" font-size="8" fill="#666">dim 8</text>

  <!-- FC -->
  <rect x="100" y="410" width="120" height="28" fill="none" stroke="#333" stroke-width="1"/>
  <text x="160" y="428" text-anchor="middle">Linear (8, 2)</text>

  <line x1="160" y1="438" x2="160" y2="460" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- Softmax -->
  <rect x="115" y="464" width="90" height="24" fill="none" stroke="#333" stroke-width="1" rx="10"/>
  <text x="160" y="480" text-anchor="middle" font-size="9">Softmax</text>

  <line x1="160" y1="488" x2="160" y2="514" stroke="#333" stroke-width="1" marker-end="url(#a)"/>

  <!-- Output -->
  <text x="160" y="528" text-anchor="middle">P(resp), P(non-resp)</text>

  <!-- Footer -->
  <line x1="60" y1="550" x2="260" y2="550" stroke="#ddd" stroke-width="0.5"/>
  <text x="160" y="568" text-anchor="middle" font-size="8" fill="#888">33K params | Focal Loss (gamma=2)</text>
  <text x="160" y="582" text-anchor="middle" font-size="8" fill="#888">98.8% parameter reduction vs dense</text>
</svg>
