[project]
name = "irnet"
version = "1.0.0"
description = "Immunotherapy Response Prediction using Pathway Knowledge-Informed GNN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torch-geometric>=2.7.0",
]

[dependency-groups]
dev = [
  "python-semantic-release>=10.5.3",
]

[tool.semantic_release]
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_author = "Ansh Kumar <anshkumar.info@gmail.com>"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release\n\nCo-authored-by: Apoorva Gupta <apoorvaagupta.info@gmail.com>"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true
